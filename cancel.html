<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Checkout canceled</title>
  <link rel="stylesheet" href="/assets/css/styles.css?v=grand-phone-banner" />
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#fff7f7;color:#7f1d1d;margin:0}
    .container{max-width:720px;margin:32px auto;padding:0 16px}
    .card{background:#fff;border:1px solid #fecaca;border-radius:14px;box-shadow:0 1px 2px rgba(127,29,29,.05);padding:18px}
    .btn{height:40px;border:1px solid #d1d5db;background:#111;color:#fff;border-radius:10px;padding:0 14px;font-weight:700;cursor:pointer}
  </style>
</head>
<body class="grand-phone-layout">
  <div class="grand-phone-banner">
    <img src="/assets/img/wallpaper.jpg" alt="Celebrate Life">
    <p class="grand-phone-banner-title">2027 Pennsylvania Grand Court</p>
  </div>

  <main class="container">
    <div class="card">
      <h1 style="margin:0 0 8px">Checkout canceled</h1>
      <p>You weren’t charged. You can review your cart and try again.</p>
      <div style="margin-top:16px">
        <a class="btn" href="/order.html">Back to Order</a>
      </div>
    </div>
  </main>
</body>
</html>
